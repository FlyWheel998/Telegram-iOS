name: CI

on:
  push:
    branches: [ sg-custom-features ]
  workflow_dispatch:
    inputs:
      build_ipa:
        description: 'Also run the full IPA build (~1-2 hours)'
        type: boolean
        default: false

jobs:
  # Fast lane. Our custom modules are pure-Foundation by design, so they need
  # neither Xcode nor macOS to typecheck and test. Linux runners are plentiful
  # and start in seconds; a free macOS runner sat unallocated for 15 minutes on
  # the first attempt. This is the loop used while fixing errors.
  logic-tests:
    runs-on: ubuntu-latest
    container: swift:6.1

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Typecheck SGTextRemoval (warnings are errors, matching Bazel copts)
        run: |
          swiftc -warnings-as-errors -typecheck \
            Swiftgram/SGTextRemoval/Sources/SGTextRemoval.swift \
            Swiftgram/SGTextRemoval/Sources/SGRemovalRuleStore.swift

      - name: Run SGTextRemoval unit tests
        run: |
          swiftc -warnings-as-errors \
            Swiftgram/SGTextRemoval/Sources/SGTextRemoval.swift \
            Swiftgram/SGTextRemoval/Sources/SGRemovalRuleStore.swift \
            Swiftgram/SGTextRemoval/Tests/main.swift \
            -o "$RUNNER_TEMP/sgtextremoval-tests"
          "$RUNNER_TEMP/sgtextremoval-tests"

  # The same tests on Darwin. Linux uses swift-corelibs-foundation, which differs
  # from Apple's Foundation in precisely the areas these tests probe (Unicode
  # normalisation, NSString bridging), so Linux passing is necessary but not
  # sufficient. Non-blocking, so a slow macOS queue never stalls the fast lane.
  logic-tests-darwin:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run SGTextRemoval unit tests on Darwin
        run: |
          swiftc -warnings-as-errors \
            Swiftgram/SGTextRemoval/Sources/SGTextRemoval.swift \
            Swiftgram/SGTextRemoval/Sources/SGRemovalRuleStore.swift \
            Swiftgram/SGTextRemoval/Tests/main.swift \
            -o "$RUNNER_TEMP/sgtextremoval-tests"
          "$RUNNER_TEMP/sgtextremoval-tests"

  ipa:
    runs-on: macos-26  # Xcode 26.2 required by versions.json
    needs: logic-tests
    if: github.event_name == 'workflow_dispatch' && inputs.build_ipa

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      # Credentials are injected from repository secrets and written to a gitignored file.
      # They must never be committed: this fork is public, and api_id/api_hash are tied to
      # the owner's Telegram account. The checked-in configuration JSONs carry Telegram's
      # public test values (api_id 8), which cannot be used for a real personal build.
      - name: Generate personal build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          # The bundled fake-codesigning provisioning profiles are bound to Telegram's own
          # bundle id (ph.telegra.Telegraph) and carry its entitlements, including
          # aps-environment. A custom bundle id therefore cannot be signed with them -
          # Make.py aborts with "Could not find a valid aps-environment entitlement".
          #
          # So: no secrets -> use the stock appstore configuration, which matches the fake
          # profiles. This compiles and verifies integration code, which is the point of a
          # CI build. Producing an installable app needs real provisioning profiles from the
          # owner's Apple Developer account, not just secrets.
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::warning::No Telegram API secrets set - compile-only build using Telegram's bundle id and public test credentials. The result is not installable."
            # Keep Telegram's bundle_id and team_id so the fake-codesigning profiles match,
            # but inject sg_config: Swiftgram's BuildConfiguration.py requires that key and
            # the configuration JSONs inherited from upstream Telegram do not define it.
            python3 - <<'PY'
          import json
          with open("build-system/appstore-configuration.json") as f:
              config = json.load(f)
          config.setdefault("sg_config", "")
          config["api_id"] = "8"
          config["api_hash"] = "7245de8e747a0d6fbe11f7cc14fcc0bb"
          with open("build-system/personal-configuration.json", "w") as f:
              json.dump(config, f, indent=2)
          print("compile-only configuration written (bundle_id %s)" % config["bundle_id"])
          PY
            echo "BUILD_CONFIG_PATH=build-system/personal-configuration.json" >> $GITHUB_ENV
            exit 0
          fi
          echo "BUILD_CONFIG_PATH=build-system/personal-configuration.json" >> $GITHUB_ENV
          python3 - <<'PY'
          import json, os
          config = {
              "bundle_id": os.environ.get("APP_BUNDLE_ID") or "org.sgpersonal.Swiftgram",
              "api_id": os.environ["TELEGRAM_API_ID"],
              "api_hash": os.environ["TELEGRAM_API_HASH"],
              "team_id": os.environ.get("APPLE_TEAM_ID", ""),
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "sg_config": "",
          }
          with open("build-system/personal-configuration.json", "w") as f:
              json.dump(config, f, indent=2)
          print("wrote build-system/personal-configuration.json")
          PY

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="$BUILD_CONFIG_PATH" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      # The previous actions/create-release@v1 and actions/upload-release-asset@v1
      # are archived and no longer function. Artifacts are also a better fit here:
      # the IPA is downloaded, signed locally and sideloaded, not published.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-unsigned-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-DSYMs-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14
